        price: '₪20.00',

      'holidays-4': {

        description: 'ערכה מיוחדת ומרגשת ליום המשפחה! הערכה כוללת 4 מערכי פעילות שונים ומגוונים המתאימים לחגיגת יום המשפחה בגן או בבית. כל מערך כולל מטרות חינוכיות, הוראות ביצוע מפורטות, כרטיסיות מעוצבות להדפסה, ורעיונות להרחבה. הפעילויות כוללות: עץ משפחה, סיפורי משפחה, יצירה משותפת, ומשחקים משפחתיים. הערכה מעודדת שיתוף הורים, חיזוק הקשר המשפחתי, והכרת מגוון מבני משפחה. כל החומרים מוכנים להדפסה ולשימוש מיידי, ומאפשרים ליצור אירוע משפחתי משמעותי ובלתי נשכח.',
        price: '₪45.00',
        image: 'images/Products/3-2.webp'
      },
      'holidays-5': {
        title: 'משחק ליום המשפחה',
        shortDesc: 'משחק לוח משפחתי',
        description: 'משחק לוח משפחתי מהנה ומקסים במיוחד! משחק זה תוכנן במיוחד ליום המשפחה ומתאים למשחק משותף של ילדים והורים. המשחק כולל לוח מעוצב וצבעוני, כרטיסיות משימות, קלפי שאלות על המשפחה, וחוקי משחק ברורים ופשוטים. המשחק מעודד שיחה, שיתוף, צחוק, והכרות מעמיקה יותר בין בני המשפחה. מתאים לגילאי 4-8, ניתן להתאים את רמת הקושי. הקובץ כולל את כל רכיבי המשחק להדפסה, והוראות הרכבה פשוטות. מושלם לאירוע יום המשפחה בגן או למשחק משפחתי בבית!',
        price: '₪15.00',
        image: 'images/Products/3-3.webp'

    const productKey = cat + '-' + file;
    const product = products[productKey];
    
    if (product) {
      document.getElementById('categoryName').textContent = categoryNames[cat] || 'מוצרים';
      document.getElementById('productNameBreadcrumb').textContent = product.title;
      document.getElementById('productTitle').textContent = product.title;
      
      // עבור מוצרי מתנה - להציג רק "מתנה" בגופן גדול ומודגש
      if (product.isFree) {
        document.getElementById('productPrice').innerHTML = '<span style="font-size: 2.5rem; font-weight: 700; color: var(--primary-purple); display: flex; align-items: center; gap: 0.5rem;">מתנה <span class="gift-icon-wiggle" style="font-size: 2.5rem;">🎁</span></span>';
        
        const imageWrapper = document.querySelector('.product-image-wrapper');
        const badge = document.createElement('div');
        badge.className = 'free-gift-badge';
        badge.textContent = 'מתנה';
        imageWrapper.style.position = 'relative';
        imageWrapper.appendChild(badge);
      } else {
        document.getElementById('productPrice').innerHTML = product.price;
      }
      
      document.getElementById('productDescription').innerHTML = product.description;
      document.getElementById('productImage').src = product.image;
      document.getElementById('productImage').alt = product.title;
      document.title = product.title + ' - גננת בר';
    }
    
    // Cart management functions
    function getCart() {
      const cart = localStorage.getItem('cart');
      return cart ? JSON.parse(cart) : [];
    }
    
    function saveCart(cart) {
      localStorage.setItem('cart', JSON.stringify(cart));
      updateCartCount();
    }
    
    function updateCartCount() {
      const cart = getCart();
      const cartCountElements = document.querySelectorAll('.cart-count');
      cartCountElements.forEach(el => {
        el.textContent = cart.length;
        el.style.display = cart.length > 0 ? 'flex' : 'none';
      });
    }
    
    function addToCart() {
      const productKey = cat + '-' + file;
      const product = products[productKey];
      
      if (!product) return;
      
      const cart = getCart();
      
      // Check if product already in cart
      const existingIndex = cart.findIndex(item => item.key === productKey);
      
      if (existingIndex === -1) {
        // Add to cart
        cart.push({
          key: productKey,
          title: product.title,
          price: product.price,
          image: product.image,
          category: cat,
          isFree: product.isFree || false
        });
        saveCart(cart);
        
        // Show toast notification
        showToast();
        
        // Return to shop after short delay
        setTimeout(() => {
          window.location.href = 'index.html#shop';
        }, 800);
      } else {
        // Already in cart, go back to shop
        window.location.href = 'index.html#shop';
      }
    }
    
    function showToast() {
      const toast = document.getElementById('toastNotification');
      toast.classList.add('show');
      
      setTimeout(() => {
        toast.classList.remove('show');
        toast.classList.add('hide');
        setTimeout(() => {
          toast.classList.remove('hide');
        }, 300);
      }, 2500);
    }
    
    function checkIfInCart() {
      const productKey = cat + '-' + file;
      const cart = getCart();
      const inCart = cart.some(item => item.key === productKey);
      
      if (inCart) {
        const btn = document.getElementById('addToCartBtn');
        btn.textContent = 'המשך לקניות';
        btn.classList.add('in-cart');
        btn.onclick = () => window.location.href = 'index.html';
      }
    }
    
    // Initialize
    updateCartCount();
    checkIfInCart();
    initPreviewSystem();

    // Preview System for Product Detail Page
    function initPreviewSystem() {
      console.log('🔍 Initializing Preview System for Product Detail Page');
      
      const imageWrapper = document.querySelector('.product-image-wrapper');
      const img = document.querySelector('#productImage');
      
      if (!imageWrapper || !img) {
        console.log('⚠️ Product image elements not found');
        return;
      }
      
      console.log('Found product image:', img.src);
      
      // Create preview container
      const container = document.createElement('div');
      container.className = 'product-image-container';
      container.style.position = 'relative';
      container.style.width = '100%';
      
      // Add preview icon
      const icon = document.createElement('div');
      icon.className = 'preview-icon';
      icon.style.position = 'absolute';
      icon.style.top = '1rem';
      icon.style.left = '1rem';
      icon.style.background = 'rgba(255,255,255,0.95)';
      icon.style.borderRadius = '50%';
      icon.style.width = '2.5rem';
      icon.style.height = '2.5rem';
      icon.style.display = 'flex';
      icon.style.alignItems = 'center';
      icon.style.justifyContent = 'center';
      icon.style.color = 'var(--primary-purple)';
      icon.style.boxShadow = '0 2px 8px rgba(0,0,0,0.15)';
      icon.style.pointerEvents = 'none';
      icon.style.zIndex = '10';
      icon.innerHTML = `
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:1.2rem;height:1.2rem;">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
          <line x1="11" y1="8" x2="11" y2="14"></line>
          <line x1="8" y1="11" x2="14" y2="11"></line>
        </svg>
      `;
      
      // Wrap the existing image
      img.parentNode.insertBefore(container, img);
      container.appendChild(img);
      container.appendChild(icon);
      
      // Get preview file paths based on current product
      const imgPath = img.getAttribute('src');
      const originalSrc = imgPath;
      const basePath = imgPath.substring(0, imgPath.lastIndexOf('.'));
      const previewImagePath = basePath + '_p.webp';
      const previewVideoPath = basePath + '.mp4';
      
      console.log('Original image:', imgPath);
      console.log('Preview paths:', {image: previewImagePath, video: previewVideoPath});
      
      let previewElement = null;
      let isVideoPreview = false;
      let previewLoaded = false;
      
      // Try to load video preview first
      const videoTest = document.createElement('video');
      videoTest.style.display = 'none';
      document.body.appendChild(videoTest);
      
      videoTest.addEventListener('loadedmetadata', () => {
        console.log('✓ Video preview loaded:', previewVideoPath);
        document.body.removeChild(videoTest);
        isVideoPreview = true;
        previewLoaded = true;
        previewElement = document.createElement('video');
        previewElement.src = previewVideoPath;
        previewElement.autoplay = false;
        previewElement.loop = true;
        previewElement.muted = true;
        previewElement.playsInline = true;
        previewElement.style.width = '100%';
        previewElement.style.height = 'auto';
        previewElement.style.aspectRatio = '1/1';
        previewElement.style.objectFit = 'cover';
        previewElement.style.borderRadius = 'var(--radius-sm)';
      });
      
      videoTest.addEventListener('error', (e) => {
        console.log('✗ Video not found, trying image:', previewVideoPath);
        if (videoTest.parentNode) document.body.removeChild(videoTest);
        
        // Try image preview
        const imgTest = new Image();
        imgTest.onload = () => {
          console.log('✓ Image preview loaded:', previewImagePath);
          previewLoaded = true;
          previewElement = document.createElement('img');
          previewElement.src = previewImagePath;
          previewElement.alt = img.alt + ' - תצוגה מקדימה';
          previewElement.style.width = '100%';
          previewElement.style.height = 'auto';
          previewElement.style.aspectRatio = '1/1';
          previewElement.style.objectFit = 'cover';
          previewElement.style.borderRadius = 'var(--radius-sm)';
        };
        imgTest.onerror = () => {
          console.log('✗ No preview available for this product');
        };
        imgTest.src = previewImagePath;
      });
      
      videoTest.src = previewVideoPath;
      
      // Show preview function
      const showPreview = () => {
        if (previewElement && previewLoaded) {
          const currentImg = container.querySelector('img, video');
          if (currentImg && currentImg !== previewElement) {
            container.replaceChild(previewElement, currentImg);
            container.appendChild(icon);
            if (isVideoPreview) {
              previewElement.play().catch(e => console.log('Video play failed:', e));
            }
          }
        }
      };
      
      // Hide preview function
      const hidePreview = () => {
        if (previewElement && container.contains(previewElement)) {
          if (isVideoPreview) {
            previewElement.pause();
            previewElement.currentTime = 0;
          }
          const newImg = document.createElement('img');
          newImg.id = 'productImage';
          newImg.src = originalSrc;
          newImg.alt = img.alt;
          newImg.style.width = '100%';
          newImg.style.height = 'auto';
          newImg.style.aspectRatio = '1/1';
          newImg.style.objectFit = 'cover';
          newImg.style.borderRadius = 'var(--radius-sm)';
          container.replaceChild(newImg, previewElement);
          container.appendChild(icon);
        }
      };
      
      // Mouse events for desktop
      container.addEventListener('mouseenter', showPreview);
      container.addEventListener('mouseleave', hidePreview);
      
      // Touch events for mobile
      let touchStarted = false;
      container.addEventListener('touchstart', (e) => {
        touchStarted = true;
        showPreview();
      }, { passive: true });
      
      container.addEventListener('touchend', (e) => {
        if (touchStarted) {
          setTimeout(hidePreview, 100);
          touchStarted = false;
        }
      }, { passive: true });
      
      container.addEventListener('touchcancel', (e) => {
        if (touchStarted) {
          hidePreview();
          touchStarted = false;
        }
      }, { passive: true });
      
      console.log('✅ Preview system initialized for product detail page');
    }
  </script>
